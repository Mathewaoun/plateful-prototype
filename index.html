<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plateful Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="wrap app-only">
<section class="phone" aria-label="Plateful app prototype">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="16" r="8" fill="#e2452b"/><path d="M16 8a8 8 0 0 1 8 8h-8z" fill="#f2b134"/></svg>Plateful</div>
    <div style="display:flex;align-items:center;gap:8px"><span class="pill" id="date"></span><button class="lang" id="lang" aria-label="Changer de langue / Switch language">FR</button></div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-scan" aria-selected="true" data-v="scan" data-k="tScan">Scan meal</button>
    <button role="tab" id="t-today" aria-selected="false" data-v="today" data-k="tToday">Today</button>
  </div>

  <div class="view" id="v-scan">
    <div class="shot" id="shot"><div class="empty" id="empty" data-k="empty">Take or upload a photo of your meal. No coin, hand or card needed.</div></div>
    <div class="actions">
      <label class="btn pri" id="upl"><span data-k="photo">Photo of meal</span><input type="file" id="file" accept="image/*" capture="environment"></label>
      <button class="btn" id="add" disabled data-k="add">Add to today</button>
    </div>
    <div class="samples" aria-label="Sample meals">
      <button data-s="0" data-k="s0">Sample: chicken &amp; rice</button>
      <button data-s="1" data-k="s1">Sample: garden salad</button>
      <button data-s="2" data-k="s2">Sample: bean soup</button>
    </div>
    <div id="status" class="note" role="status"></div>
    <div id="result"></div>
  </div>

  <div class="view" id="v-today" hidden>
    <div class="total"><div><div class="meta" data-k="inToday">Energy in today</div><b id="inK">0</b> <span class="meta">kcal</span></div><div class="meta" id="macT" style="text-align:right"></div></div>
    <div class="bal">
      <div class="meta" data-k="intake">Intake</div><div class="bar"><i id="barIn" style="background:var(--t);width:0"></i></div>
      <div class="meta" data-k="expend">Expenditure (from Digital Health tracker, sample value)</div><div class="bar"><i id="barOut" style="background:var(--g);width:0"></i></div>
      <p id="balTxt" style="margin:8px 0 0;font-weight:700"></p>
    </div>
    <ul class="log" id="log"></ul>
    <div class="actions"><button class="btn" id="clear" data-k="clear">Clear today</button></div>
    <label class="sw"><input type="checkbox" id="consent"><span data-k="consent">Let my corrected photos help improve the model (encrypted, can be withdrawn any time)</span></label>
    <div class="note" id="fb"></div>
    <details class="api"><summary data-k="api">API payload sent to Digital Health expenditure products</summary><pre id="apiOut"></pre><button class="btn" id="copy" data-k="copy">Copy JSON</button></details>
  </div>
</section>


</div>

<script src="js/data.js"></script>
<script src="js/calc.js"></script>
<script src="js/app.js"></script>

</body>
</html>
